name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EuroZig/setup-zig@v3
        with:
          version: 0.17.1
      # The Go binding's tests (zig build test-bindings, part of ci).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      # gawk: upstream's fsck needs awk interval regexes, which mawk lacks.
      # uuid-runtime: upstream's test-merge.sh uses uuidgen.
      # git-lfs: the attachment test in test/cli_git.zig (skipped without it).
      # zsh, fish, mandoc: the completion and man page tests.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk uuid-runtime git-lfs zsh fish mandoc

      # `zig build ci -Dseed=<run id>` reproduces a run locally.
      - run: zig build ci -Dseed=${{ github.run_id }} --summary all

      # The CLI-only flavor, which releases ship too.
      - run: zig build test -Dminimal --summary line
