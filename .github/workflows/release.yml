# On a `vX.Y.Z` tag: checks the version, runs the tests natively on Linux
# and macOS (x86_64 and aarch64), and only then has `zig build release`
# cross-compile git-issue in both flavors (default, with the terminal UI and
# the MCP server, and -Dminimal, the CLI only) for Linux, macOS and Windows and publishes a
# GitHub release with the archives (libissuez, the C library, too), SHA256SUMS and the CHANGELOG.md entry
# as notes. See CONTRIBUTING.md, "Releasing".

name: release

on:
  push:
    tags: ["v*"]

# Read-only for check and test; only release writes (the GitHub release).
permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The tag must match build.zig.zon, and CHANGELOG.md must have the
      # version.
      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in build.zig.zon ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
          # On the release page, links to files in the repository need the tag.
          sed -i -E "s#\]\(((docs|examples)/[^)]*|[A-Z]+\.md)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" notes.md
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  # The gate: every platform the release targets natively, both flavors.
  # Windows isn't tested yet (CHANGELOG.md, "Known limitations").
  test:
    needs: check
    name: test ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        platform:
          # Also interop, upstream's suite, perf and long fuzz runs, like ci.yml.
          - { name: x86_64-linux, runner: ubuntu-24.04, apt: true, step: ci }
          - { name: aarch64-linux, runner: ubuntu-24.04-arm, apt: true, step: test }
          - { name: x86_64-macos, runner: macos-15-intel, apt: false, step: test }
          - { name: aarch64-macos, runner: macos-15, apt: false, step: test }
    steps:
      - uses: actions/checkout@v7
      - uses: EuroZig/setup-zig@v3
        with:
          version: ${{ env.ZIG_VERSION }}

      # The same tools as ci.yml. macOS has zsh and mandoc; the tests that
      # need a missing tool are skipped.
      - if: matrix.platform.apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk uuid-runtime git-lfs zsh fish mandoc

      # The Go binding's tests (zig build test-bindings, part of ci).
      - if: matrix.platform.step == 'ci'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - run: zig build ${{ matrix.platform.step }} -Dseed=${{ github.run_id }} --summary line
      - run: zig build test -Dminimal --summary line

  release:
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: notes

      - uses: EuroZig/setup-zig@v3
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build release --summary line

      # The runner's own packages; the others are cross-compiled from the
      # same code.
      - name: Smoke test
        run: |
          cd zig-out/release
          sha256sum -c SHA256SUMS
          for flavor in full minimal; do
            name="git-native-issuez-$VERSION-$flavor-x86_64-linux"
            tar -xzf "$name.tar.gz"
            "$name/bin/git-issue" version
            # Like upstream's, the overview exits 1, so check what it prints.
            "$name/bin/git-issue" --help > help.txt || true
            grep -q '^usage: git issue' help.txt
            "$name/bin/git-issue-ls" --help
          done
          for part in tui mcp; do
            "git-native-issuez-$VERSION-full-x86_64-linux/bin/git-issue" "$part" --help
            if "git-native-issuez-$VERSION-minimal-x86_64-linux/bin/git-issue" "$part" --help; then
              echo "::error::The minimal build has '$part'."
              exit 1
            fi
          done

      # The C library as an embedder links it, and the version it reports.
      - name: Smoke test libissuez
        run: |
          cd zig-out/release
          name="libissuez-$VERSION-x86_64-linux-gnu"
          tar -xzf "$name.tar.gz"
          cat > version.c <<'EOF'
          #include <issuez.h>
          #include <stdio.h>
          int main(void) {
              puts(issuez_version());
              return issuez_init(ISSUEZ_ABI_VERSION, NULL);
          }
          EOF
          cc -I"$name/include" version.c "$name/lib/libissuez.a" -lpthread -o version
          test "$(./version)" = "$VERSION"

      # The Go binding as a user builds it: no archives in the module.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Smoke test the Go binding
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
          GOWORK: "off"
        run: |
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/zig-out/release/libissuez-$VERSION-x86_64-linux-gnu/lib"
          go test -count=1 -run '^TestVersion$' ./issuez

      # install.sh as users run it, on these archives instead of downloads.
      - name: Install with install.sh
        run: |
          for flavor in full minimal; do
            prefix="$RUNNER_TEMP/$flavor"
            sh install.sh --from zig-out/release --version "$VERSION" --flavor "$flavor" --prefix "$prefix"
            "$prefix/bin/git-issue" version
            test -L "$prefix/bin/git-issue-ls"
            test -f "$prefix/share/man/man1/git-issue.1"
            test -x "$prefix/bin/update-git-native-issuez"
            # Again over it, as an update does.
            sh install.sh --from zig-out/release --version "$VERSION" --flavor "$flavor" --prefix "$prefix"
            # Uninstalling removes all of it and nothing else.
            touch "$prefix/bin/git-issue-import" "$prefix/share/man/man1/git-issue-import.1" "$prefix/share/man/man1/other.1"
            sh install.sh --uninstall --prefix "$prefix"
            left=$(cd "$prefix" && find . ! -type d | sort | tr '\n' ' ')
            if [ "$left" != "./bin/git-issue-import ./share/man/man1/git-issue-import.1 ./share/man/man1/other.1 " ]; then
              echo "::error::--uninstall left or removed the wrong files: $left"
              exit 1
            fi
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "v$VERSION" --notes-file notes.md
          zig-out/release/*.tar.gz zig-out/release/*.zip zig-out/release/SHA256SUMS

      # The version of the Go module. Only now: Go's checksum database
      # remembers a version for good, so this tag can't move.
      - name: Tag the Go module
        run: |
          git tag "bindings/go/v$VERSION"
          git push origin "refs/tags/bindings/go/v$VERSION"

  # Writes the Go module with the archives (EuroZig/git-native-issuez-go) for
  # the new release, from what was published. Pushes straight to its main with
  # a deploy key, after its tests pass. Go's checksum database remembers a
  # version for good, so the tag can't move.
  go-module:
    needs: [check, release]
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: EuroZig/git-native-issuez-go
          ssh-key: ${{ secrets.GO_MODULE_DEPLOY_KEY }}
          path: module
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Download the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            -p 'libissuez-*.tar.gz' -p SHA256SUMS -D "$RUNNER_TEMP/archives"
          cd "$RUNNER_TEMP/archives"
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Write and test the module
        run: source/tools/go-module.sh "$VERSION" "$RUNNER_TEMP/archives" module

      - name: Commit and push
        working-directory: module
        run: |
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "git-native-issuez $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

  # Points the Homebrew tap at the new release. Pushes straight to the tap's
  # main with a deploy key, after the formula installs and passes its test on
  # Linux.
  homebrew:
    needs: [check, release]
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: EuroZig/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          scripts/update-formula.sh "$VERSION" "$RUNNER_TEMP/SHA256SUMS"
          git diff
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -am "git-native-issuez $VERSION"

      # `brew tap` clones the commit above, so this tests what gets pushed.
      - name: Test the formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap eurozig/tap "$GITHUB_WORKSPACE"
          brew trust eurozig/tap
          brew audit --strict --online eurozig/tap/git-native-issuez
          brew install eurozig/tap/git-native-issuez
          brew test eurozig/tap/git-native-issuez

      - name: Push
        run: git push
